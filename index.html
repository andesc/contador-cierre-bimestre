<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador - Cierre de Bimestre</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:transparent;color:#1f2937}
.card{width:100%;padding:clamp(18px,3vw,32px);border-radius:14px;background:#f5f7fa;text-align:center}
.title{margin:0 0 8px;font-size:clamp(21px,3vw,32px);line-height:1.2;font-weight:700}
.subtitle{margin:0 0 clamp(18px,3vw,28px);font-size:clamp(15px,2vw,20px);line-height:1.45;color:#4b5563}
.countdown{width:100%;display:flex;justify-content:center;gap:clamp(8px,1.5vw,16px);flex-wrap:wrap}
.unit{flex:1 1 130px;min-width:100px;max-width:180px;padding:clamp(12px,2vw,20px) 10px;border-radius:10px;background:#fff}
.number{font-size:clamp(28px,5vw,44px);font-weight:700;line-height:1.1}
.label{margin-top:6px;font-size:clamp(10px,1.4vw,13px);font-weight:600;letter-spacing:.5px;color:#6b7280}
.footer{margin-top:clamp(16px,2.5vw,24px);font-size:clamp(13px,1.7vw,17px);line-height:1.4;color:#6b7280}
.finished{font-size:clamp(22px,4vw,30px);font-weight:700;padding:20px 0}
@media(max-width:520px){.unit{flex:1 1 calc(50% - 8px);max-width:none;min-width:0}.card{border-radius:10px}}
</style>
</head>
<body>
<div class="card">
<h1 class="title">🚨 ¡Últimas horas para regularizar!</h1>
<p class="subtitle">El bimestre cierra el <strong>domingo 4 de octubre a las 23:59 hs.</strong></p>
<div id="countdown" class="countdown" aria-live="polite">
<div class="unit"><div id="days" class="number">--</div><div class="label">DÍAS</div></div>
<div class="unit"><div id="hours" class="number">--</div><div class="label">HORAS</div></div>
<div class="unit"><div id="minutes" class="number">--</div><div class="label">MINUTOS</div></div>
<div class="unit"><div id="seconds" class="number">--</div><div class="label">SEGUNDOS</div></div>
</div>
<div class="footer">⏰ Aprovechá este tiempo para completar tus actividades pendientes.</div>
</div>
<script>
const fechaCierre=new Date("2026-10-04T23:59:00-03:00").getTime();
const d=document.getElementById("days"),h=document.getElementById("hours"),m=document.getElementById("minutes"),s=document.getElementById("seconds"),c=document.getElementById("countdown");
function actualizar(){const x=fechaCierre-Date.now();if(x<=0){c.innerHTML='<div class="finished">🔴 El bimestre ha finalizado</div>';document.querySelector(".footer").textContent="El período de cursada ha finalizado.";return}
d.textContent=String(Math.floor(x/86400000)).padStart(2,"0");
h.textContent=String(Math.floor(x/3600000)%24).padStart(2,"0");
m.textContent=String(Math.floor(x/60000)%60).padStart(2,"0");
s.textContent=String(Math.floor(x/1000)%60).padStart(2,"0")}
actualizar();setInterval(actualizar,1000);
</script>
</body>
</html>
