<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador - Cierre de Bimestre</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        font-family: Arial, Helvetica, sans-serif;
        background: transparent;
        color: #1f2937;
    }
    .card {
        width: 100%;
        max-width: 760px;
        padding: 24px;
        border-radius: 14px;
        background: #f5f7fa;
        text-align: center;
    }
    .title {
        margin: 0 0 8px;
        font-size: clamp(20px, 4vw, 28px);
        font-weight: 700;
    }
    .subtitle {
        margin: 0 0 20px;
        font-size: 16px;
        line-height: 1.45;
        color: #4b5563;
    }
    .countdown {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .unit {
        min-width: 82px;
        padding: 12px 10px;
        border-radius: 9px;
        background: #fff;
    }
    .number {
        font-size: clamp(25px, 6vw, 34px);
        font-weight: 700;
        line-height: 1.1;
    }
    .label {
        margin-top: 5px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .5px;
        color: #6b7280;
    }
    .footer {
        margin-top: 18px;
        font-size: 14px;
        color: #6b7280;
    }
    .finished {
        font-size: 24px;
        font-weight: 700;
        padding: 20px 0;
    }
</style>
</head>
<body>

<div class="card">
    <h1 class="title">🚨 ¡Últimas horas para cerrar el bimestre!</h1>

    <p class="subtitle">
        El bimestre cierra el <strong>domingo 4 de octubre a las 23:59 hs</strong>.
    </p>

    <div id="countdown" class="countdown" aria-live="polite">
        <div class="unit">
            <div id="days" class="number">--</div>
            <div class="label">DÍAS</div>
        </div>
        <div class="unit">
            <div id="hours" class="number">--</div>
            <div class="label">HORAS</div>
        </div>
        <div class="unit">
            <div id="minutes" class="number">--</div>
            <div class="label">MINUTOS</div>
        </div>
        <div class="unit">
            <div id="seconds" class="number">--</div>
            <div class="label">SEGUNDOS</div>
        </div>
    </div>

    <div class="footer">
        ⏰ Aprovechá este tiempo para completar tus actividades pendientes.
    </div>
</div>

<script>
const fechaCierre = new Date("2026-10-04T23:59:00-03:00").getTime();

const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");
const countdownEl = document.getElementById("countdown");

function actualizarContador() {
    const ahora = Date.now();
    const diferencia = fechaCierre - ahora;

    if (diferencia <= 0) {
        countdownEl.innerHTML = '<div class="finished">🔴 El bimestre ha finalizado</div>';
        const footer = document.querySelector(".footer");
        footer.textContent = "El período de cursada ha finalizado.";
        return;
    }

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diferencia / (1000 * 60)) % 60);
    const segundos = Math.floor((diferencia / 1000) % 60);

    daysEl.textContent = String(dias).padStart(2, "0");
    hoursEl.textContent = String(horas).padStart(2, "0");
    minutesEl.textContent = String(minutos).padStart(2, "0");
    secondsEl.textContent = String(segundos).padStart(2, "0");
}

actualizarContador();
setInterval(actualizarContador, 1000);
</script>

</body>
</html>
